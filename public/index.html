<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omrani Systems</title>
<meta name="description" content="Omrani Systems: Pass, Chat, AI, IT and Gym.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
 <div class="content">

  <header class="hero">
    <svg class="hero-mark" viewBox="4 4 112 112" role="img" aria-label="Omrani Systems logo">
      <circle cx="60" cy="60" r="46" fill="none" stroke="#0B0D12" stroke-width="9"/>
      <path d="M116 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H4" fill="none" stroke="#FFFFFF" stroke-width="21"/>
      <path d="M102 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H18" fill="none" stroke="#1E8FE1" stroke-width="11"/>
    </svg>
    <div class="hero-text">
      <h1 class="wordmark"><span class="w-strong">omrani</span><span class="w-light">systems</span></h1>
      <p class="domain">omranisystems.com</p>
    </div>
  </header>

  <section class="apps" aria-label="Apps">
    <button class="app" type="button" data-app="pass" data-name="Pass">
      <span class="tile">
        <svg viewBox="4 4 124 124" aria-hidden="true">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="9"/>
          <path d="M116 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H4" fill="none" stroke="#0B0D12" stroke-width="21"/>
          <path d="M102 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H18" fill="none" stroke="#EF4444" stroke-width="11"/>
          <circle cx="100" cy="100" r="19" fill="#DC2626" stroke="#0B0D12" stroke-width="5"/>
          <path d="M94 98V94A6 6 0 0 1 106 94V98" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
          <rect x="91" y="97" width="18" height="13" rx="3" fill="#FFFFFF"/>
          <path d="M100 101V106" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="label">Pass</span>
    </button>

    <button class="app" type="button" data-app="chat" data-name="H_CHAT">
      <span class="tile">
        <svg viewBox="4 4 124 124" aria-hidden="true">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="9"/>
          <path d="M116 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H4" fill="none" stroke="#0B0D12" stroke-width="21"/>
          <path d="M102 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H18" fill="none" stroke="#8C2A3F" stroke-width="11"/>
          <circle cx="100" cy="100" r="19" fill="#6E1B2B" stroke="#0B0D12" stroke-width="5"/>
          <path d="M89 92Q89 88 93 88H107Q111 88 111 92V102Q111 106 107 106H98L92 111V106H93Q89 106 89 102Z" fill="#FFFFFF"/>
          <path d="M94 94H106M94 99H102" fill="none" stroke="#6E1B2B" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="label">H_CHAT</span>
    </button>

    <button class="app" type="button" data-app="ai" data-name="AI">
      <span class="tile">
        <svg viewBox="4 4 124 124" aria-hidden="true">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="9"/>
          <path d="M116 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H4" fill="none" stroke="#0B0D12" stroke-width="21"/>
          <path d="M102 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H18" fill="none" stroke="#6B7380" stroke-width="11"/>
          <circle cx="100" cy="100" r="19" fill="#3F4652" stroke="#0B0D12" stroke-width="5"/>
          <path d="M100 86Q102 98 114 100Q102 102 100 114Q98 102 86 100Q98 98 100 86Z" fill="#FFFFFF"/>
        </svg>
      </span>
      <span class="label">AI</span>
    </button>

    <button class="app" type="button" data-app="it" data-name="IT">
      <span class="tile">
        <svg viewBox="4 4 124 124" aria-hidden="true">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="9"/>
          <path d="M116 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H4" fill="none" stroke="#0B0D12" stroke-width="21"/>
          <path d="M102 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H18" fill="none" stroke="#3B5BDB" stroke-width="11"/>
          <circle cx="100" cy="100" r="19" fill="#1E3A8A" stroke="#0B0D12" stroke-width="5"/>
          <path d="M93 92L86 100L93 108M107 92L114 100L107 108M103 89L97 111" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="label">IT</span>
    </button>

    <button class="app" type="button" data-app="gym" data-name="Gym">
      <span class="tile">
        <svg viewBox="4 4 124 124" aria-hidden="true">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="9"/>
          <path d="M116 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H4" fill="none" stroke="#0B0D12" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M102 32H52Q40 32 40 44V48Q40 60 52 60H68Q80 60 80 72V76Q80 88 68 88H18" fill="none" stroke="#EA580C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="96" cy="96" r="19" fill="#EA580C"/>
          <g fill="#FFFFFF">
            <rect x="90" y="94" width="12" height="4" rx="2"/>
            <rect x="87" y="90" width="4" height="12" rx="1.6"/>
            <rect x="101" y="90" width="4" height="12" rx="1.6"/>
            <rect x="84" y="92" width="3" height="8" rx="1.4"/>
            <rect x="105" y="92" width="3" height="8" rx="1.4"/>
          </g>
        </svg>
      </span>
      <span class="label">Gym</span>
    </button>
  </section>
 </div>

  <footer class="footer">© <span id="year"></span> Hamza Omrani LLC</footer>
</main>

<dialog id="unlock" aria-labelledby="unlock-title">
  <form id="unlock-form" method="dialog" novalidate>
    <h2 id="unlock-title">Enter access code</h2>
    <p class="unlock-app" id="unlock-app"></p>
    <label for="code" class="sr-only">Access code</label>
    <input id="code" name="code" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="Access code" required>
    <p class="error" id="unlock-error" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn btn-ghost" id="unlock-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="unlock-submit">Continue</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
