# /etc/nginx/snippets/gate.conf
# Protects a subdomain with the access code from omranisystems.com.
# In the server block:   set $gate_app pass;   include snippets/gate.conf;
# In its "location /":   auth_request /__gate;   error_page 401 = @unlock;

location = /__gate {
    internal;
    proxy_pass http://127.0.0.1:4000/gate/verify?app=$gate_app;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location @unlock {
    return 302 https://omranisystems.com/unlock?app=$gate_app;
}
